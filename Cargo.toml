[workspace]
members = [
    "rust/forge-assets",
    "rust/forge-bridge",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
forge-assets = { path = "rust/forge-assets" }

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
cxx   = "1"
